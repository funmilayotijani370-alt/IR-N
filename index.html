<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IR.N - Video Platform</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  height: 64px;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 20px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.search {
  flex: 1;
  max-width: 500px;
  padding: 12px;
  border: 0;
  border-radius: 20px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
}

.layout {
  display: flex;
  min-height: calc(100vh - 64px);
}

.side {
  width: 180px;
  background: white;
  padding: 20px 10px;
}

.side button {
  width: 100%;
  margin-bottom: 10px;
  background: transparent;
  text-align: left;
}

.side button:hover {
  background: #eef2ff;
}

.content {
  flex: 1;
  padding: 25px;
}

.hero {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 25px;
}

.hero h1 {
  margin-top: 0;
}

.upload {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 25px;
}

.upload input {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 10px #0001;
}

.card video {
  width: 100%;
  display: block;
}

.card-info {
  padding: 12px;
}

.card-info h3 {
  margin: 0 0 8px;
}

.status {
  margin-top: 10px;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 12px;
}

@media (max-width: 600px) {
  .side {
    width: 90px;
  }

  .side button {
    font-size: 12px;
    text-align: center;
  }

  .content {
    padding: 12px;
  }

  header {
    padding: 0 10px;
  }

  .search {
    min-width: 0;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">IR.N</div>

  <input
    id="search"
    class="search"
    placeholder="Search videos..."
    oninput="searchVideos()"
  >

  <button onclick="alert('Sign-in will be added in the next stage.')">
    Sign in
  </button>
</header>

<div class="layout">

  <aside class="side">
    <button onclick="showHome()">🏠 Home</button>
    <button onclick="showVideos()">🎥 Videos</button>
    <button onclick="showUpload()">⬆️ Upload</button>
    <button onclick="alert('Your library is stored on this device for now.')">
      📚 My Library
    </button>
  </aside>

  <main class="content">

    <section class="hero" id="home">
      <h1>Welcome to IR.N</h1>
      <p>Upload, discover and watch video content in one simple place.</p>

      <button class="primary" onclick="showUpload()">
        Upload a video
      </button>
    </section>

    <section class="upload" id="uploadBox" style="display:none;">

      <h2>Upload to IR.N</h2>

      <label>Video title</label>

      <input
        id="title"
        type="text"
        placeholder="Enter a title"
      >

      <label>Choose video</label>

      <input
        id="file"
        type="file"
        accept="video/*"
      >

      <button class="primary" onclick="addVideo()">
        Add to library
      </button>

      <div id="status" class="status"></div>

    </section>

    <h2>Latest videos</h2>

    <section id="grid" class="grid"></section>

  </main>
</div>

<script>

let videos = [];

/* Show upload section */
function showUpload() {
  document.getElementById("uploadBox").style.display = "block";

  window.scrollTo({
    top: document.getElementById("uploadBox").offsetTop,
    behavior: "smooth"
  });
}

/* Show home */
function showHome() {
  document.getElementById("uploadBox").style.display = "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* Show videos */
function showVideos() {
  document.getElementById("uploadBox").style.display = "none";

  document.getElementById("grid").scrollIntoView({
    behavior: "smooth"
  });
}

/* Add video */
function addVideo() {

  const fileInput = document.getElementById("file");
  const titleInput = document.getElementById("title");
  const status = document.getElementById("status");

  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Please choose a video first.";
    return;
  }

  if (!file.type.startsWith("video/")) {
    status.textContent = "Please select a video file.";
    return;
  }

  const title =
    titleInput.value.trim() || file.name;

  const videoURL = URL.createObjectURL(file);

  videos.unshift({
    title: title,
    url: videoURL,
    name: file.name
  });

  renderVideos();

  titleInput.value = "";
  fileInput.value = "";

  status.textContent = "Video added successfully!";

  setTimeout(() => {
    status.textContent = "";
  }, 3000);
}

/* Display videos */
function renderVideos(list = videos) {

  const grid = document.getElementById("grid");

  if (list.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        No videos yet. Upload the first video to IR.N.
      </div>
    `;

    return;
  }

  grid.innerHTML = "";

  list.forEach((video) => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <video controls src="${video.url}"></video>

      <div class="card-info">
        <h3>${escapeHTML(video.title)}</h3>
        <small>${escapeHTML(video.name)}</small>
      </div>
    `;

    grid.appendChild(card);
  });
}

/* Search */
function searchVideos() {

  const query =
    document.getElementById("search").value.toLowerCase();

  const results = videos.filter(video =>
    video.title.toLowerCase().includes(query) ||
    video.name.toLowerCase().includes(query)
  );

  renderVideos(results);
}

/* Protect titles from HTML */
function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

/* Start empty */
renderVideos();

</script>

</body>
</html>
